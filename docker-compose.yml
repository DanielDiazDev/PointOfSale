services:
  pointofsale-api:
    build:
      context: .
      dockerfile: src/External/PointOfSale.API/Dockerfile
    container_name: pointofsale-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=${DB_CONNECTION_STRING:-Server=host.docker.internal;Port=3306;Database=pointofsaledb;User Id=root;Pwd=root;}
      - JWT__Key=${JWT_KEY}
      - JWT__Issuer=${JWT_ISSUER:-PointOfSale}
      - JWT__Audience=${JWT_AUDIENCE:-PointOfSaleClient}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
