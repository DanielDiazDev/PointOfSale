name: Build, Publish, and Deploy Project to SmarterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

     

      - name: Publish Application
        run: dotnet publish --configuration Release --no-build --output ./release

      - name: Deploy to SmarterASP.NET
        shell: powershell
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          $siteName = $env:WEBSITE_NAME
          $computer = $env:SERVER_COMPUTER_NAME
          $user     = $env:SERVER_USERNAME
          $password = $env:SERVER_PASSWORD

          Write-Host "Deploying to SmarterASP.NET site: $siteName"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$(pwd)\release" `
            -dest:contentPath="$siteName",ComputerName="$computer",UserName="$user",Password="$password",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule
