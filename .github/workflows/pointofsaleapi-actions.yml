name: Build, Publish, and Deploy Project to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore
          
      - name: Build Project
        run: dotnet build --configuration Release --no-restore
        env:
          ConnectionStrings__Database: ${{ secrets.CONNECTION_STRING }}
          JWT__Key: ${{ secrets.JWT_KEY }}
          JWT__Issuer: ${{ secrets.JWT_ISSUER }}
          JWT__Audience: ${{ secrets.JWT_AUDIENCE }}
          
      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef

      - name: Run Database Migrations
        run: dotnet ef database update --project ./src/External/PointOfSale.Infrastructure/PointOfSale.Infrastructure.csproj --startup-project ./src/External/PointOfSale.API/PointOfSale.API.csproj --connection "${{ secrets.CONNECTION_STRING }}"
        env:
          ConnectionStrings__Database: ${{ secrets.CONNECTION_STRING }}
                
      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --runtime win-x86
      
      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          