name: Deploy point of sale api

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PointOfSale.sln

      - name: Build
        run: dotnet build PointOfSale.sln -c Release --no-restore

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          dotnet-ef --version

      - name: Create EF migration bundle
        run: dotnet ef migrations bundle --project src/External/PointOfSale.Infrastructure --startup-project src/External/PointOfSale.API -o efbundle

      - name: Run migrations
        run: ./efbundle --connection "${{ secrets.CONNECTION_STRING }}"

      - name: Build and start container
        run: |
          DB_CONNECTION_STRING="${{ secrets.CONNECTION_STRING }}" \
          JWT_KEY="${{ secrets.JWT_KEY }}" \
          JWT_ISSUER="${{ secrets.JWT_ISSUER }}" \
          JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}" \
          docker compose up -d --build

      - name: Verify container is running
        run: docker compose ps && docker compose logs --tail 50 pointofsale-api
